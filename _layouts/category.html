---
layout: dashboard
---

{% assign category_posts = site.categories[page.taxonomy] %}

<header class="home-feed-header">
  <h1 id="page-title">{{ page.title }}</h1>
  <p>전체 <strong>{{ category_posts | size }}</strong>편</p>
</header>

{{ content }}

<div class="home-post-list">
  {% for post in category_posts %}
    {% unless post.hidden %}
      {% include home-post-card.html post=post %}
    {% endunless %}
  {% endfor %}
</div>
