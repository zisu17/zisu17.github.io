---
layout: dashboard
---

{% assign topic_posts = site.posts | where: "nav_topic", page.nav_topic %}

<header class="home-feed-header">
  <h1>{{ page.title }}</h1>
  <p>전체 <strong>{{ topic_posts | size }}</strong>편</p>
</header>

{{ content }}

<div class="home-post-list">
  {% for post in topic_posts %}
    {% unless post.hidden %}
      {% include home-post-card.html post=post %}
    {% endunless %}
  {% endfor %}
</div>
